name: CI

on:
  pull_request:
  push:
    branches: [main, staging, development]

# Cancela execuções antigas do mesmo branch/PR quando há novo push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lê a versão do pnpm do campo packageManager do package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Version lockstep
        run: pnpm version:check

      - name: Release scripts tests
        run: pnpm test:release

      # Guards de versão/changelog (ADR-0031): só rodam aqui, sem o `pnpm test` completo.
      - name: Changelog/version guards
        run: pnpm --filter backend test --testPathPatterns="product-version|changelog-entries|changelog-semver"

      - name: Type-check
        run: pnpm check-types

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # TODO(DX-3): o `pnpm test` completo NÃO roda no CI (o `date-picker.test.tsx` do
      # frontend é instável sob carga); roda localmente. Só os guards de versão/changelog
      # (step acima) e `version:check` rodam aqui. Adicionar o completo após estabilizar o teste.
