name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancela execuções antigas do mesmo branch/PR quando há novo push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lê a versão do pnpm do campo packageManager do package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check-types

      - name: Lint
        run: pnpm lint

      # TODO(DX-3): adicionar `pnpm test` quando a suíte (TEST-2) existir.
